name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Full sandbox suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact action commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck python3 ripgrep
      - name: Run all checks
        run: ./scripts/check.sh

  macos:
    name: macOS 14 arm64 read-only smoke
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Checkout exact action commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assert supported runner
        run: |
          test "$(uname -m)" = arm64
          /bin/bash --version
          sw_vers -productVersion
      - name: Syntax and zero-write smoke
        run: ./scripts/check.sh --smoke-only
