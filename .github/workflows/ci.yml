name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux pinned static lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_ARCHIVE_URL: "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz"
      SHELLCHECK_ARCHIVE_SHA256: "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"
    steps:
      - name: Checkout exact action commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned ShellCheck
        run: |
          set -euo pipefail
          test "$(/usr/bin/uname -m)" = x86_64
          archive="$RUNNER_TEMP/shellcheck.tar.gz"
          extract_dir="$RUNNER_TEMP/shellcheck"
          bin_dir="$RUNNER_TEMP/bin"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 \
            --output "$archive" "$SHELLCHECK_ARCHIVE_URL"
          printf '%s  %s\n' "$SHELLCHECK_ARCHIVE_SHA256" "$archive" | \
            /usr/bin/sha256sum --check --strict
          /usr/bin/mkdir -p "$extract_dir" "$bin_dir"
          /usr/bin/tar -xzf "$archive" -C "$extract_dir"
          /usr/bin/install -m 0755 \
            "$extract_dir/shellcheck-v$SHELLCHECK_VERSION/shellcheck" \
            "$bin_dir/shellcheck"
          "$bin_dir/shellcheck" --version | \
            /usr/bin/grep -F "version: $SHELLCHECK_VERSION"
          printf '%s\n' "$bin_dir" >>"$GITHUB_PATH"
      - name: Run portable static checks
        run: ./scripts/check.sh --lint-only

  macos:
    name: macOS 14 arm64 full sandbox suite
    runs-on: macos-14
    timeout-minutes: 30
    env:
      LANG: C
      LC_ALL: C
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_ARCHIVE_URL: "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.darwin.aarch64.tar.gz"
      SHELLCHECK_ARCHIVE_SHA256: "339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f"
      BATS_VERSION: "1.13.0"
      BATS_COMMIT: "3bca150ec86275d6d9d5a4fd7d48ab8b6c6f3d87"
      BATS_ARCHIVE_URL: "https://codeload.github.com/bats-core/bats-core/tar.gz/3bca150ec86275d6d9d5a4fd7d48ab8b6c6f3d87"
      BATS_ARCHIVE_SHA256: "4f1628b894fb52368cddd6deab97358c500ab8ef337f291ddd779e1760a08a43"
      RG_VERSION: "15.2.0"
      RG_ARCHIVE_URL: "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-aarch64-apple-darwin.tar.gz"
      RG_ARCHIVE_SHA256: "3750b2e93f37e0c692657da574d7019a101c0084da05a790c83fd335bad973e4"
    steps:
      - name: Checkout exact action commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Assert supported runner
        run: |
          test "$(uname -m)" = arm64
          /bin/bash --version
          sw_vers -productVersion
      - name: Install pinned test tools
        run: |
          set -euo pipefail
          shellcheck_archive="$RUNNER_TEMP/shellcheck.tar.gz"
          bats_archive="$RUNNER_TEMP/bats-core.tar.gz"
          rg_archive="$RUNNER_TEMP/ripgrep.tar.gz"
          shellcheck_dir="$RUNNER_TEMP/shellcheck"
          bats_dir="$RUNNER_TEMP/bats-core"
          rg_dir="$RUNNER_TEMP/ripgrep"
          bin_dir="$RUNNER_TEMP/bin"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --output "$shellcheck_archive" \
            "$SHELLCHECK_ARCHIVE_URL"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --output "$bats_archive" "$BATS_ARCHIVE_URL"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --output "$rg_archive" "$RG_ARCHIVE_URL"
          printf '%s  %s\n' \
            "$SHELLCHECK_ARCHIVE_SHA256" "$shellcheck_archive" | \
            /usr/bin/shasum -a 256 -c -
          printf '%s  %s\n' "$BATS_ARCHIVE_SHA256" "$bats_archive" | \
            /usr/bin/shasum -a 256 -c -
          printf '%s  %s\n' "$RG_ARCHIVE_SHA256" "$rg_archive" | \
            /usr/bin/shasum -a 256 -c -
          /bin/mkdir -p \
            "$shellcheck_dir" "$bats_dir" "$rg_dir" "$bin_dir"
          /bin/ln -s /bin/bash "$bin_dir/bash"
          /usr/bin/tar -xzf "$shellcheck_archive" -C "$shellcheck_dir"
          /usr/bin/tar -xzf "$bats_archive" -C "$bats_dir"
          /usr/bin/tar -xzf "$rg_archive" -C "$rg_dir"
          /usr/bin/install -m 0755 \
            "$shellcheck_dir/shellcheck-v$SHELLCHECK_VERSION/shellcheck" \
            "$bin_dir/shellcheck"
          /usr/bin/install -m 0755 \
            "$rg_dir/ripgrep-$RG_VERSION-aarch64-apple-darwin/rg" \
            "$bin_dir/rg"
          bats_root="$bats_dir/bats-core-$BATS_COMMIT"
          export PATH="$bin_dir:$bats_root/bin:$PATH"
          test "$(command -v bash)" = "$bin_dir/bash"
          "$bin_dir/bash" --version | \
            /usr/bin/grep -F 'version 3.2.'
          "$bin_dir/shellcheck" --version | \
            /usr/bin/grep -F "version: $SHELLCHECK_VERSION"
          "$bats_root/bin/bats" --version | \
            /usr/bin/grep -F "Bats $BATS_VERSION"
          "$bin_dir/rg" --version | \
            /usr/bin/grep -F "ripgrep $RG_VERSION"
          printf '%s\n' "$bin_dir" "$bats_root/bin" >>"$GITHUB_PATH"
      - name: Run all checks on the target platform
        run: |
          export PATH="$RUNNER_TEMP/bin:$RUNNER_TEMP/bats-core/bats-core-$BATS_COMMIT/bin:$PATH"
          test "$(command -v bash)" = "$RUNNER_TEMP/bin/bash"
          ./scripts/check.sh
